document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

 stroke-width=\"1.6\" fill=\"none\"><\u002Fpath>\n            <\u002Fg>\n            <g style=\"opacity:{{ crack2O }};animation:crackIn .8s\">\n              <path d=\"M58,0 L65,19 L52,33 L61,50 L55,56\" stroke=\"#120b08\" stroke-width=\"2.6\" fill=\"none\"><\u002Fpath>\n              <path d=\"M52,33 L40,38\" stroke=\"#120b08\" stroke-width=\"1.5\" fill=\"none\"><\u002Fpath>\n              <path d=\"M182,4 L173,21 L184,37 L171,56\" stroke=\"#120b08\" stroke-width=\"2.4\" fill=\"none\"><\u002Fpath>\n              <path d=\"M322,0 L313,15 L324,33 L311,49 L319,56\" stroke=\"#120b08\" stroke-width=\"2.6\" fill=\"none\"><\u002Fpath>\n              <path d=\"M324,33 L336,40\" stroke=\"#120b08\" stroke-width=\"1.5\" fill=\"none\"><\u002Fpath>\n              <path d=\"M173,21 L162,25\" stroke=\"#120b08\" stroke-width=\"1.4\" fill=\"none\"><\u002Fpath>\n            <\u002Fg>\n            <line x1=\"136\" y1=\"0\" x2=\"136\" y2=\"56\" stroke=\"#000\" stroke-opacity=\".45\" stroke-width=\"1\" stroke-dasharray=\"3 3\"><\u002Fline>\n            <line x1=\"268\" y1=\"0\" x2=\"268\" y2=\"56\" stroke=\"#000\" stroke-opacity=\".45\" stroke-width=\"1\" stroke-dasharray=\"3 3\"><\u002Fline>\n          <\u002Fsvg>\n          <div style=\"position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;padding:0 12px\">\n            <span style=\"font-family:'Barlow Condensed';font-weight:700;font-size:26px;color:#f2e4d0;text-shadow:0 1px 3px rgba(0,0,0,.7)\">{{ bHpLabel }}<\u002Fspan>\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:#d8a894;text-shadow:0 1px 3px rgba(0,0,0,.7)\">{{ bPctLabel }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <!-- ataques -->\n      <div style=\"display:flex;flex-direction:column;gap:7px;margin-top:12px\">\n        <sc-for list=\"{{ attacks }}\" as=\"a\" hint-placeholder-count=\"6\">\n          <button sc-camel-on-click=\"{{ a.tap }}\" disabled=\"{{ a.locked }}\" style=\"display:flex;align-items:center;gap:10px;text-align:left;background:{{ a.bg }};border:1px solid {{ a.bd }};border-radius:2px;padding:10px 12px;min-height:48px;opacity:{{ a.op }}\" style-active=\"transform:translateY(1px)\">\n            <div style=\"flex:1;min-width:0\">\n              <div style=\"font-size:13px;font-weight:500;color:#ddd3c4;line-height:1.25\">{{ a.name }}<\u002Fdiv>\n              <div style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.08em;color:#6b5f4f;margin-top:2px\">{{ a.meta }}<\u002Fdiv>\n            <\u002Fdiv>\n            <sc-if value=\"{{ a.locked }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.12em;color:#7a4a38;border:1px solid #3a241a;padding:3px 7px;border-radius:2px;flex:none\">{{ a.lockLabel }}<\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ a.open }}\" hint-placeholder-val=\"{{ true }}\">\n              <div style=\"text-align:right;flex:none\">\n                <div style=\"font-family:'Barlow Condensed';font-weight:700;font-size:24px;line-height:1;color:#d4552f\">{{ a.dmgLabel }}<\u002Fdiv>\n                <div style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;color:#c9a05a\">{{ a.xpLabel }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"margin-top:10px;text-align:right\"><a href=\"#\" sc-camel-on-click=\"{{ goJefe }}\" style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.12em\">VER DETALLE →<\u002Fa><\u002Fdiv>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n    <sc-if value=\"{{ bNotActive }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"background:#131009;border:1px solid #292014;border-radius:3px;padding:16px;text-align:center\">\n        <div style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.12em;color:#8f8069\">{{ bStatusLabel }}<\u002Fdiv>\n        <button sc-camel-on-click=\"{{ goJefe }}\" style=\"margin-top:10px;background:#241a0e;border:1px solid #7a5726;color:#ffc36b;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.12em;padding:9px 16px;border-radius:2px\">IR AL JEFE →<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ══ VISTA: PERSONAJE ══ -->\n  <sc-if value=\"{{ isPj }}\" hint-placeholder-val=\"{{ false }}\">\n  <div data-screen-label=\"PERSONAJE\" style=\"padding:14px;display:flex;flex-direction:column;gap:14px\">\n    <div style=\"display:flex;justify-content:space-between;align-items:baseline\">\n      <div style=\"font-family:'Barlow Condensed';font-weight:700;font-size:24px;letter-spacing:.14em;color:#e8ddca\">PERSONAJE<\u002Fdiv>\n      <div style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;color:#8f8069\">NIVEL <span style=\"color:#ffc36b;font-size:15px\">{{ glevel }}<\u002Fspan> · {{ totalXpLabel }} XP<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:10px\">\n      <sc-for list=\"{{ attrs }}\" as=\"at\" hint-placeholder-count=\"4\">\n        <div style=\"background:#131009;border:1px solid #292014;border-radius:3px;padding:12px\">\n          <div style=\"display:flex;justify-content:space-between;align-items:baseline\">\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.14em;color:#8f8069\">{{ at.name }}<\u002Fspan>\n            <span style=\"font-family:'Barlow Condensed';font-weight:700;font-size:30px;line-height:1;color:#ffc36b\">{{ at.level }}<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"height:7px;background:#1c1610;border:1px solid #2b2114;border-radius:2px;overflow:hidden;margin-top:8px\">\n            <div style=\"height:100%;width:{{ at.w }}%;background:linear-gradient(180deg,#e08b3a,#a85e1c)\"><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;color:#6b5f4f;margin-top:5px\">{{ at.xpLabel }} XP<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <div style=\"background:#131009;border:1px solid #292014;border-radius:3px\">\n      <div style=\"padding:10px 14px;border-bottom:1px solid #221a10;font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.18em;color:#8f8069\">LOG DE COMBATE<\u002Fdiv>\n      <sc-if value=\"{{ logEmpty }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"padding:16px 14px;font-size:12px;color:#6b5f4f\">Aún no hay nada registrado. Todo empieza con un golpe.<\u002Fdiv>\n      <\u002Fsc-if>\n      <div style=\"display:flex;flex-direction:column;max-height:52vh;overflow-y:auto\">\n        <sc-for list=\"{{ log }}\" as=\"e\" hint-placeholder-count=\"6\">\n          <div style=\"display:flex;gap:10px;align-items:baseline;padding:8px 14px;border-bottom:1px solid #1a140d\">\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;color:#5f5344;flex:none;width:74px\">{{ e.time }}<\u002Fspan>\n            <span style=\"flex:1;font-size:12px;color:{{ e.txtColor }};line-height:1.35\">{{ e.txt }}<span style=\"color:#6b5f4f;font-style:italic\"> {{ e.noteLabel }}<\u002Fspan><\u002Fspan>\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;color:#d4552f;flex:none\">{{ e.dmgLabel }}<\u002Fspan>\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;color:#c9a05a;flex:none\">{{ e.xpLabel }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ══ VISTA: JEFE ══ -->\n  <sc-if value=\"{{ isJefe }}\" hint-placeholder-val=\"{{ false }}\">\n  <div data-screen-label=\"JEFE\" style=\"padding:14px;display:flex;flex-direction:column;gap:14px\">\n    <div>\n      <div style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.2em;color:#8a5a4a\">{{ bStatusTag }} · {{ bAttr }} · {{ deadlineLabel }}<\u002Fdiv>\n      <div style=\"font-family:'Barlow Condensed';font-weight:700;font-size:30px;line-height:1.1;color:#e8ddca;margin-top:2px\">{{ bName }}<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"position:relative;height:44px;background:#1a0f0b;border:1px solid #3a2318;border-radius:2px;overflow:hidden\">\n      <div style=\"position:absolute;top:0;left:0;bottom:0;width:{{ bHpW }}%;background:linear-gradient(180deg,#a83a28,#5e1e14)\"><\u002Fdiv>\n      <div style=\"position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;padding:0 12px\">\n        <span style=\"font-family:'Barlow Condensed';font-weight:700;font-size:22px;color:#f2e4d0;text-shadow:0 1px 3px rgba(0,0,0,.7)\">{{ bHpLabel }}<\u002Fspan>\n        <span style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;color:#d8a894\">{{ phaseLabel }} · {{ bPctLabel }}<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- acciones de estado -->\n    <sc-if value=\"{{ bActive }}\" hint-placeholder-val=\"{{ true }}\">\n      <button sc-camel-on-click=\"{{ doVictory }}\" style=\"background:#241a0e;border:1px solid #7a5726;color:#ffc36b;font-family:'Barlow Condensed';font-weight:700;font-size:18px;letter-spacing:.14em;padding:13px;border-radius:2px\" style-active=\"transform:translateY(1px)\">☩ EL RESULTADO OCURRIÓ — VICTORIA REAL<\u002Fbutton>\n    <\u002Fsc-if>\n    <sc-if value=\"{{ bExhaustedPending }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"background:#17110b;border:1px solid #7a5726;border-radius:3px;padding:14px\">\n        <div style=\"font-family:'Barlow Condensed';font-weight:700;font-size:20px;color:#ffc36b;letter-spacing:.1em\">JEFE AGOTADO — PENDIENTE DE COBRO<\u002Fdiv>\n        <div style=\"font-size:12px;color:#9a8b76;margin:6px 0 10px 0;line-height:1.45\">Hiciste el trabajo. Cuando el resultado real llegue, cóbrate el 30% de XP restante.<\u002Fdiv>\n        <button sc-camel-on-click=\"{{ doCollect }}\" style=\"width:100%;background:#2a1f10;border:1px solid #a8762e;color:#ffc36b;font-family:'Barlow Condensed';font-weight:700;font-size:17px;letter-spacing:.12em;padding:12px;border-radius:2px\">COBRAR RESULTADO · {{ collectLabel }}<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n    <sc-if value=\"{{ bTimeout }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"background:#170d0b;border:1px solid #5e2a1c;border-radius:3px;padding:14px\">\n        <div style=\"font-family:'Barlow Condensed';font-weight:700;font-size:20px;color:#d4552f;letter-spacing:.1em\">TIEMPO AGOTADO<\u002Fdiv>\n        <div style=\"font-size:12px;color:#9a8b76;margin:6px 0 10px 0;line-height:1.45\">El plazo venció con el jefe en pie ({{ bPctLabel }} de HP). La revancha conserva el daño hecho: no se vuelve a empezar.<\u002Fdiv>\n        <div style=\"display:flex;gap:8px\">\n          <input type=\"date\" value=\"{{ rematchDate }}\" sc-camel-on-change=\"{{ setRematchDate }}\" min=\"{{ tomorrow }}\" style=\"flex:1;background:#1c1610;border:1px solid #3a2d1a;color:#ddd3c4;font-family:'IBM Plex Mono',monospace;font-size:12px;padding:9px;border-radius:2px;color-scheme:dark\">\n          <button sc-camel-on-click=\"{{ doRematch }}\" style=\"background:#2a130a;border:1px solid #8a3a1c;color:#ff7a3c;font-family:'Barlow Condensed';font-weight:700;font-size:16px;letter-spacing:.12em;padding:0 16px;border-radius:2px\">REVANCHA<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n    <sc-if value=\"{{ bClosed }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"background:#131009;border:1px solid #292014;border-radius:3px;padding:14px;display:flex;justify-content:space-between;align-items:center;gap:10px\">\n        <div style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.1em;color:#8f8069\">{{ bStatusLabel }}<\u002Fdiv>\n        <button sc-camel-on-click=\"{{ openNb }}\" style=\"background:#241a0e;border:1px solid #7a5726;color:#ffc36b;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.12em;padding:9px 14px;border-radius:2px\">＋ NUEVO JEFE<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-for list=\"{{ pendings }}\" as=\"p\" hint-placeholder-count=\"0\">\n      <div style=\"background:#17110b;border:1px solid #4a3a22;border-radius:3px;padding:12px;display:flex;justify-content:space-between;align-items:center;gap:10px\">\n        <div style=\"min-width:0\">\n          <div style=\"font-size:13px;color:#ddd3c4\">{{ p.name }}<\u002Fdiv>\n          <div style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;color:#8f8069;letter-spacing:.08em\">AGOTADO · PENDIENTE DE COBRO<\u002Fdiv>\n        <\u002Fdiv>\n        <button sc-camel-on-click=\"{{ p.collect }}\" style=\"flex:none;background:#2a1f10;border:1px solid #a8762e;color:#ffc36b;font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.1em;padding:8px 12px;border-radius:2px\">COBRAR {{ p.xpLabel }}<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n\n    <!-- formulario nuevo jefe -->\n    <sc-if value=\"{{ nbOpen }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"background:#131009;border:1px solid #3a2d1a;border-radius:3px;padding:14px;display:flex;flex-direction:column;gap:10px\">\n        <div style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.18em;color:#ffc36b\">NUEVO JEFE<\u002Fdiv>\n        <input value=\"{{ nb.name }}\" sc-camel-on-change=\"{{ nb.setName }}\" placeholder=\"Nombre del objetivo (con fecha límite real)\" style=\"background:#1c1610;border:1px solid #3a2d1a;color:#ddd3c4;font-size:13px;padding:10px;border-radius:2px\">\n        <div style=\"display:flex;gap:8px\">\n          <sc-raw-select value=\"{{ nb.attr }}\" sc-camel-on-change=\"{{ nb.setAttr }}\" style=\"flex:1;background:#1c1610;border:1px solid #3a2d1a;color:#ddd3c4;font-family:'IBM Plex Mono',monospace;font-size:12px;padding:9px;border-radius:2px\">\n            <option value=\"Negocio\">Negocio<\u002Foption><option value=\"Creación\">Creación<\u002Foption><option value=\"Oficio\">Oficio<\u002Foption><option value=\"Cuerpo\">Cuerpo<\u002Foption>\n          <\u002Fsc-raw-select>\n          <input type=\"date\" value=\"{{ nb.deadline }}\" sc-camel-on-change=\"{{ nb.setDeadline }}\" min=\"{{ tomorrow }}\" style=\"flex:1;background:#1c1610;border:1px solid #3a2d1a;color:#ddd3c4;font-family:'IBM Plex Mono',monospace;font-size:12px;padding:9px;border-radius:2px;color-scheme:dark\">\n        <\u002Fdiv>\n        <div style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.1em;color:#6b5f4f\">ATAQUES PLANIFICADOS (el HP del jefe = 80% del daño del plan)<\u002Fdiv>\n        <sc-for list=\"{{ nbRows }}\" as=\"r\" hint-placeholder-count=\"1\">\n          <div style=\"display:grid;grid-template-columns:1fr 84px 52px 52px 28px;gap:6px;align-items:center\">\n            <input value=\"{{ r.name }}\" sc-camel-on-change=\"{{ r.setName }}\" placeholder=\"Acción\" style=\"background:#1c1610;border:1px solid #3a2d1a;color:#ddd3c4;font-size:12px;padding:8px;border-radius:2px;min-width:0\">\n            <sc-raw-select value=\"{{ r.tier }}\" sc-camel-on-change=\"{{ r.setTier }}\" style=\"background:#1c1610;border:1px solid #3a2d1a;color:#ddd3c4;font-family:'IBM Plex Mono',monospace;font-size:10px;padding:8px 4px;border-radius:2px\">\n              <option value=\"Trivial\">Trivial<\u002Foption><option value=\"Menor\">Menor<\u002Foption><option value=\"Estándar\">Estándar<\u002Foption><option value=\"Mayor\">Mayor<\u002Foption><option value=\"Épica\">Épica<\u002Foption>\n            <\u002Fsc-raw-select>\n            <sc-raw-select value=\"{{ r.phase }}\" sc-camel-on-change=\"{{ r.setPhase }}\" style=\"background:#1c1610;border:1px solid #3a2d1a;color:#ddd3c4;font-family:'IBM Plex Mono',monospace;font-size:10px;padding:8px 4px;border-radius:2px\">\n              <option value=\"1\">F1<\u002Foption><option value=\"2\">F2<\u002Foption><option value=\"3\">F3<\u002Foption>\n            <\u002Fsc-raw-select>\n            <input type=\"number\" value=\"{{ r.planned }}\" sc-camel-on-change=\"{{ r.setPlanned }}\" min=\"1\" style=\"background:#1c1610;border:1px solid #3a2d1a;color:#ddd3c4;font-family:'IBM Plex Mono',monospace;font-size:11px;padding:8px 6px;border-radius:2px;width:100%;box-sizing:border-box\">\n            <button sc-camel-on-click=\"{{ r.del }}\" style=\"background:none;border:1px solid #3a241a;color:#7a4a38;font-size:12px;padding:7px 0;border-radius:2px\">×<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n        <button sc-camel-on-click=\"{{ nb.addRow }}\" style=\"background:none;border:1px dashed #3a2d1a;color:#8f8069;font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.1em;padding:8px;border-radius:2px\">＋ AÑADIR ATAQUE<\u002Fbutton>\n        <div style=\"display:flex;justify-content:space-between;align-items:center\">\n          <span style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;color:#8f8069\">HP: <span style=\"color:#d4552f\">{{ nbHp }}<\u002Fspan> · XP base: <span style=\"color:#c9a05a\">{{ nbXp }}<\u002Fspan><\u002Fspan>\n          <div style=\"display:flex;gap:8px\">\n            <button sc-camel-on-click=\"{{ nb.cancel }}\" style=\"background:none;border:1px solid #2b2114;color:#8f8069;font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.1em;padding:9px 12px;border-radius:2px\">CANCELAR<\u002Fbutton>\n            <button sc-camel-on-click=\"{{ nb.create }}\" style=\"background:#241a0e;border:1px solid #7a5726;color:#ffc36b;font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.1em;padding:9px 14px;border-radius:2px\">INVOCAR JEFE<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- plan vs real -->\n    <div style=\"background:#131009;border:1px solid #292014;border-radius:3px\">\n      <div style=\"padding:10px 14px;border-bottom:1px solid #221a10;font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.18em;color:#8f8069\">PLAN ORIGINAL VS REAL<\u002Fdiv>\n      <sc-for list=\"{{ plan }}\" as=\"pl\" hint-placeholder-count=\"9\">\n        <div style=\"padding:9px 14px;border-bottom:1px solid #1a140d\">\n          <div style=\"display:flex;justify-content:space-between;gap:10px;align-items:baseline\">\n            <span style=\"font-size:12px;color:#ddd3c4;min-width:0\">{{ pl.name }}<\u002Fspan>\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;color:#8f8069;flex:none\">F{{ pl.phase }} · {{ pl.dmgU }} ud · <span style=\"color:#ffc36b\">{{ pl.used }}<\u002Fspan>/{{ pl.planned }}<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"height:4px;background:#1c1610;border-radius:2px;overflow:hidden;margin-top:6px\">\n            <div style=\"height:100%;width:{{ pl.w }}%;background:#a8762e\"><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n\n    <!-- daño por día -->\n    <div style=\"background:#131009;border:1px solid #292014;border-radius:3px;padding:12px 14px\">\n      <div style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.18em;color:#8f8069;margin-bottom:10px\">DAÑO POR DÍA<\u002Fdiv>\n      <div style=\"display:flex;align-items:flex-end;gap:3px;height:80px\">\n        <sc-for list=\"{{ chart }}\" as=\"c\" hint-placeholder-count=\"14\">\n          <div style=\"flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%;gap:3px;align-items:center\">\n            <div style=\"font-family:'IBM Plex Mono',monospace;font-size:8px;color:#c9a05a\">{{ c.v }}<\u002Fdiv>\n            <div style=\"width:100%;height:{{ c.h }}%;min-height:2px;background:{{ c.bg }};border-radius:1px\"><\u002Fdiv>\n            <div style=\"font-family:'IBM Plex Mono',monospace;font-size:8px;color:#5f5344\">{{ c.lb }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- log de la pelea -->\n    <div style=\"background:#131009;border:1px solid #292014;border-radius:3px\">\n      <div style=\"padding:10px 14px;border-bottom:1px solid #221a10;font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.18em;color:#8f8069\">LOG DE LA PELEA<\u002Fdiv>\n      <sc-if value=\"{{ bLogEmpty }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"padding:14px;font-size:12px;color:#6b5f4f\">Sin golpes todavía.<\u002Fdiv>\n      <\u002Fsc-if>\n      <sc-for list=\"{{ bLog }}\" as=\"e\" hint-placeholder-count=\"4\">\n        <div style=\"display:flex;gap:10px;align-items:baseline;padding:8px 14px;border-bottom:1px solid #1a140d\">\n          <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;color:#5f5344;flex:none;width:74px\">{{ e.time }}<\u002Fspan>\n          <span style=\"flex:1;font-size:12px;color:#c9bda9\">{{ e.txt }}<\u002Fspan>\n          <span style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;color:#d4552f;flex:none\">{{ e.dmgLabel }}<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ══ VISTA: TIENDA ══ -->\n  <sc-if value=\"{{ isTienda }}\" hint-placeholder-val=\"{{ false }}\">\n  <div data-screen-label=\"TIENDA\" style=\"padding:14px;display:flex;flex-direction:column;gap:14px\">\n    <div style=\"display:flex;justify-content:space-between;align-items:baseline\">\n      <div style=\"font-family:'Barlow Condensed';font-weight:700;font-size:24px;letter-spacing:.14em;color:#e8ddca\">TIENDA<\u002Fdiv>\n      <div style=\"font-family:'Barlow Condensed';font-weight:700;font-size:30px;color:#e0c26a\">{{ goldLabel }} <span style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.14em;color:#8f8069\">ORO<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;color:{{ sundayColor }};letter-spacing:.06em;line-height:1.5\">{{ sundayNote }}<\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:10px\">\n      <sc-for list=\"{{ rewards }}\" as=\"r\" hint-placeholder-count=\"3\">\n        <div style=\"background:#131009;border:1px solid #292014;border-radius:3px;padding:12px 14px;display:flex;align-items:center;gap:10px\">\n          <div style=\"flex:1;min-width:0\">\n            <input value=\"{{ r.name }}\" sc-camel-on-change=\"{{ r.setName }}\" style=\"background:none;border:none;color:#ddd3c4;font-size:14px;width:100%;padding:0\">\n            <div style=\"display:flex;align-items:center;gap:4px;margin-top:3px\">\n              <input type=\"number\" value=\"{{ r.priceVal }}\" sc-camel-on-change=\"{{ r.setPrice }}\" disabled=\"{{ priceLocked }}\" style=\"background:#1c1610;border:1px solid #2b2114;color:#e0c26a;font-family:'IBM Plex Mono',monospace;font-size:11px;padding:3px 6px;border-radius:2px;width:64px;opacity:{{ priceOp }}\">\n              <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;color:#6b5f4f;letter-spacing:.1em\">ORO<\u002Fspan>\n              <button sc-camel-on-click=\"{{ r.del }}\" style=\"margin-left:8px;background:none;border:none;color:#4a3a2a;font-size:11px;padding:2px\">eliminar<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <button sc-camel-on-click=\"{{ r.buy }}\" disabled=\"{{ r.noBuy }}\" style=\"flex:none;background:{{ r.buyBg }};border:1px solid {{ r.buyBd }};color:{{ r.buyFg }};font-family:'Barlow Condensed';font-weight:700;font-size:16px;letter-spacing:.1em;padding:10px 16px;border-radius:2px\" style-active=\"transform:translateY(1px)\">COMPRAR<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <div style=\"background:#100d08;border:1px dashed #2b2114;border-radius:3px;padding:12px 14px;display:flex;gap:8px\">\n      <input value=\"{{ rwName }}\" sc-camel-on-change=\"{{ setRwName }}\" placeholder=\"Nueva recompensa real\" style=\"flex:1;background:#1c1610;border:1px solid #3a2d1a;color:#ddd3c4;font-size:13px;padding:9px;border-radius:2px;min-width:0\">\n      <input type=\"number\" value=\"{{ rwPrice }}\" sc-camel-on-change=\"{{ setRwPrice }}\" placeholder=\"oro\" style=\"width:70px;background:#1c1610;border:1px solid #3a2d1a;color:#e0c26a;font-family:'IBM Plex Mono',monospace;font-size:12px;padding:9px;border-radius:2px\">\n      <button sc-camel-on-click=\"{{ addReward }}\" style=\"background:#241a0e;border:1px solid #7a5726;color:#ffc36b;font-family:'IBM Plex Mono',monospace;font-size:11px;padding:0 14px;border-radius:2px\">＋<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- toast registro -->\n  <sc-if value=\"{{ toastOn }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:fixed;z-index:40;bottom:76px;left:50%;transform:translateX(-50%);width:min(452px,calc(100% - 28px));background:#1a140c;border:1px solid #7a5726;border-radius:3px;padding:10px 12px;display:flex;align-items:center;gap:10px;animation:toastIn .25s ease-out;box-shadow:0 8px 30px rgba(0,0,0,.6)\">\n      <div style=\"font-family:'Barlow Condensed';font-weight:700;font-size:22px;color:#ffc36b;flex:none\">{{ toastXp }}<\u002Fdiv>\n      <div style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;color:#e0c26a;flex:none\">{{ toastGold }}<\u002Fdiv>\n      <input value=\"{{ toastNote }}\" sc-camel-on-change=\"{{ setToastNote }}\" placeholder=\"nota (opcional)\" style=\"flex:1;background:#12100a;border:1px solid #2b2114;color:#c9bda9;font-size:12px;padding:7px 9px;border-radius:2px;min-width:0\">\n      <button sc-camel-on-click=\"{{ closeToast }}\" style=\"background:none;border:none;color:#8f8069;font-size:14px;padding:4px;flex:none\">✕<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- resumen de días perdidos -->\n  <sc-if value=\"{{ summaryOn }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:fixed;inset:0;z-index:50;background:rgba(5,4,3,.88);display:flex;align-items:center;justify-content:center;padding:20px;animation:overlayIn .3s\">\n      <div style=\"width:min(440px,100%);background:#131009;border:1px solid #3a2d1a;border-radius:3px;padding:18px\">\n        <div style=\"font-family:'Barlow Condensed';font-weight:700;font-size:22px;letter-spacing:.14em;color:#ffc36b\">MIENTRAS NO ESTABAS<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:7px;margin:12px 0;max-height:50vh;overflow-y:auto\">\n          <sc-for list=\"{{ summary }}\" as=\"ln\" hint-placeholder-count=\"3\">\n            <div style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;color:#c9bda9;line-height:1.5;border-left:2px solid #3a2d1a;padding-left:10px\">{{ ln }}<\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <button sc-camel-on-click=\"{{ closeSummary }}\" style=\"width:100%;background:#241a0e;border:1px solid #7a5726;color:#ffc36b;font-family:'Barlow Condensed';font-weight:700;font-size:17px;letter-spacing:.14em;padding:11px;border-radius:2px\">CONTINUAR<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- post-mortem -->\n  <sc-if value=\"{{ pmOn }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:fixed;inset:0;z-index:60;background:rgba(5,4,3,.94);display:flex;align-items:center;justify-content:center;padding:20px;animation:overlayIn .3s\">\n      <div style=\"width:min(440px,100%);background:#131009;border:1px solid #5e2a1c;border-radius:3px;padding:18px;max-height:88vh;overflow-y:auto\">\n        <div style=\"font-family:'Barlow Condensed';font-weight:700;font-size:26px;letter-spacing:.14em;color:#d4552f\">POST-MORTEM<\u002Fdiv>\n        <div style=\"font-size:12px;color:#9a8b76;line-height:1.5;margin:8px 0 14px 0\">HP a 0. Nada permanente se pierde. El momentum vuelve a ×1.00 y las dailies quedan en pausa 48 h. El fracaso sirve para recortar la lista, no para castigar.<\u002Fdiv>\n        <div style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.14em;color:#8f8069;margin-bottom:6px\">QUÉ PASÓ *<\u002Fdiv>\n        <textarea value=\"{{ pmA }}\" sc-camel-on-change=\"{{ setPmA }}\" rows=\"3\" style=\"width:100%;box-sizing:border-box;background:#1c1610;border:1px solid #3a2d1a;color:#ddd3c4;font-size:13px;padding:9px;border-radius:2px;resize:vertical\"><\u002Ftextarea>\n        <div style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.14em;color:#8f8069;margin:12px 0 6px 0\">QUÉ QUITO DE MI LISTA *<\u002Fdiv>\n        <textarea value=\"{{ pmB }}\" sc-camel-on-change=\"{{ setPmB }}\" rows=\"3\" style=\"width:100%;box-sizing:border-box;background:#1c1610;border:1px solid #3a2d1a;color:#ddd3c4;font-size:13px;padding:9px;border-radius:2px;resize:vertical\"><\u002Ftextarea>\n        <div style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.14em;color:#8f8069;margin:14px 0 6px 0\">ELIMINAR DAILIES (opcional)<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:6px\">\n          <sc-for list=\"{{ pmDrops }}\" as=\"pd\" hint-placeholder-count=\"5\">\n            <button sc-camel-on-click=\"{{ pd.toggle }}\" style=\"display:flex;align-items:center;gap:10px;background:#17120c;border:1px solid #2b2114;color:#c9bda9;font-size:12px;padding:8px 10px;border-radius:2px;text-align:left\">\n              <span style=\"width:14px;height:14px;border:1px solid #4a3a22;border-radius:2px;background:{{ pd.bg }};flex:none\"><\u002Fspan>{{ pd.name }}\n            <\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <button sc-camel-on-click=\"{{ submitPm }}\" disabled=\"{{ pmDisabled }}\" style=\"width:100%;margin-top:16px;background:{{ pmBtnBg }};border:1px solid {{ pmBtnBd }};color:{{ pmBtnFg }};font-family:'Barlow Condensed';font-weight:700;font-size:17px;letter-spacing:.14em;padding:12px;border-radius:2px\">SEGUIR ADELANTE<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- overlay JEFE AGOTADO (ruptura) -->\n  <sc-if value=\"{{ shatterOn }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:fixed;inset:0;z-index:70;background:rgba(4,3,2,.95);display:flex;align-items:center;justify-content:center;padding:20px;animation:overlayIn .25s\">\n      <div style=\"position:absolute;inset:0;background:#ffc36b;animation:flashOut .5s ease-out forwards;pointer-events:none\"><\u002Fdiv>\n      <div style=\"text-align:center;width:min(420px,100%)\">\n        <div style=\"position:relative;height:56px;margin:0 auto 26px auto;width:300px\">\n          <div style=\"position:absolute;left:0;top:0;width:60px;height:56px;background:linear-gradient(180deg,#a83a28,#5e1e14);clip-path:polygon(0 0,100% 8%,82% 100%,0 100%);animation:shA .9s .15s ease-in forwards\"><\u002Fdiv>\n          <div style=\"position:absolute;left:52px;top:0;width:58px;height:56px;background:linear-gradient(180deg,#a83a28,#5e1e14);clip-path:polygon(14% 8%,100% 0,88% 92%,0 100%);animation:shB .9s .2s ease-in forwards\"><\u002Fdiv>\n          <div style=\"position:absolute;left:104px;top:0;width:56px;height:56px;background:linear-gradient(180deg,#a83a28,#5e1e14);clip-path:polygon(8% 0,100% 12%,92% 100%,0 88%);animation:shC .9s .12s ease-in forwards\"><\u002Fdiv>\n          <div style=\"position:absolute;left:154px;top:0;width:56px;height:56px;background:linear-gradient(180deg,#a83a28,#5e1e14);clip-path:polygon(10% 12%,100% 0,90% 88%,0 100%);animation:shD .9s .22s ease-in forwards\"><\u002Fdiv>\n          <div style=\"position:absolute;left:204px;top:0;width:52px;height:56px;background:linear-gradient(180deg,#a83a28,#5e1e14);clip-path:polygon(6% 0,100% 10%,94% 100%,0 92%);animation:shE .9s .17s ease-in forwards\"><\u002Fdiv>\n          <div style=\"position:absolute;left:250px;top:0;width:50px;height:56px;background:linear-gradient(180deg,#a83a28,#5e1e14);clip-path:polygon(10% 10%,100% 0,100% 100%,0 90%);animation:shF .9s .25s ease-in forwards\"><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-family:'Barlow Condensed';font-weight:700;font-size:52px;color:#ffc36b;animation:titleIn 1s .5s both;text-shadow:0 0 40px rgba(240,155,60,.4)\">JEFE AGOTADO<\u002Fdiv>\n        <div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:#c9bda9;margin-top:10px;animation:overlayIn .6s 1s both\">Hiciste el trabajo. Eso ya es ganar.<\u002Fdiv>\n        <div style=\"font-family:'Barlow Condensed';font-weight:700;font-size:26px;color:#e0c26a;margin-top:14px;animation:overlayIn .6s 1.2s both\">{{ shatterReward }}<\u002Fdiv>\n        <div style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;color:#8f8069;margin-top:6px;animation:overlayIn .6s 1.3s both\">30% de XP pendiente de cobro cuando llegue el resultado<\u002Fdiv>\n        <button sc-camel-on-click=\"{{ closeShatter }}\" style=\"margin-top:24px;background:#241a0e;border:1px solid #7a5726;color:#ffc36b;font-family:'Barlow Condensed';font-weight:700;font-size:17px;letter-spacing:.16em;padding:12px 28px;border-radius:2px;animation:overlayIn .6s 1.5s both\">CONTINUAR<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- overlay VICTORIA REAL -->\n  <sc-if value=\"{{ victoryOn }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:fixed;inset:0;z-index:70;background:rgba(4,3,2,.95);display:flex;align-items:center;justify-content:center;padding:20px;animation:overlayIn .25s\">\n      <div style=\"text-align:center;width:min(420px,100%)\">\n        <div style=\"font-family:'Barlow Condensed';font-weight:700;font-size:56px;color:#ffc36b;animation:titleIn 1s both;text-shadow:0 0 50px rgba(240,155,60,.55)\">VICTORIA REAL<\u002Fdiv>\n        <div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:#c9bda9;margin-top:10px;animation:overlayIn .6s .6s both\">El resultado ocurrió. Victoria épica.<\u002Fdiv>\n        <div style=\"font-family:'Barlow Condensed';font-weight:700;font-size:28px;color:#e0c26a;margin-top:14px;animation:overlayIn .6s .8s both\">{{ victoryReward }}<\u002Fdiv>\n        <button sc-camel-on-click=\"{{ closeVictory }}\" style=\"margin-top:24px;background:#241a0e;border:1px solid #7a5726;color:#ffc36b;font-family:'Barlow Condensed';font-weight:700;font-size:17px;letter-spacing:.16em;padding:12px 28px;border-radius:2px;animation:overlayIn .6s 1s both\">CONTINUAR<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- exportar / importar -->\n  <sc-if value=\"{{ exportOn }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:fixed;inset:0;z-index:55;background:rgba(5,4,3,.9);display:flex;align-items:center;justify-content:center;padding:20px;animation:overlayIn .25s\">\n      <div style=\"width:min(440px,100%);background:#131009;border:1px solid #3a2d1a;border-radius:3px;padding:16px\">\n        <div style=\"font-family:'Barlow Condensed';font-weight:700;font-size:20px;letter-spacing:.14em;color:#e8ddca\">COPIA DE SEGURIDAD<\u002Fdiv>\n        <div style=\"font-size:11px;color:#8f8069;margin:6px 0 10px 0;line-height:1.45\">Todo el estado en JSON. Descárgalo o cópialo. Para restaurar, pega un backup y pulsa IMPORTAR.<\u002Fdiv>\n        <textarea value=\"{{ exportText }}\" sc-camel-on-change=\"{{ setExportText }}\" rows=\"9\" spellcheck=\"false\" style=\"width:100%;box-sizing:border-box;background:#0e0b07;border:1px solid #2b2114;color:#9a8b76;font-family:'IBM Plex Mono',monospace;font-size:10px;padding:8px;border-radius:2px;resize:vertical\"><\u002Ftextarea>\n        <div style=\"display:flex;gap:8px;margin-top:10px;flex-wrap:wrap\">\n          <button sc-camel-on-click=\"{{ doDownload }}\" style=\"flex:1;background:#241a0e;border:1px solid #7a5726;color:#ffc36b;font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.1em;padding:10px;border-radius:2px\">DESCARGAR<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ doCopy }}\" style=\"flex:1;background:#1c1610;border:1px solid #3a2d1a;color:#c9bda9;font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.1em;padding:10px;border-radius:2px\">{{ copyLabel }}<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ doImport }}\" style=\"flex:1;background:#1c1610;border:1px solid #5e2a1c;color:#d4552f;font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.1em;padding:10px;border-radius:2px\">IMPORTAR<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ closeExport }}\" style=\"flex:1;background:none;border:1px solid #2b2114;color:#8f8069;font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.1em;padding:10px;border-radius:2px\">CERRAR<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- nav -->\n  <div style=\"position:fixed;z-index:30;bottom:0;left:50%;transform:translateX(-50%);width:min(480px,100%);background:#0e0b07;border-top:1px solid #292014;display:grid;grid-template-columns:1fr 1fr 1fr 1fr;padding-bottom:env(safe-area-inset-bottom)\">\n    <sc-for list=\"{{ nav }}\" as=\"n\" hint-placeholder-count=\"4\">\n      <button sc-camel-on-click=\"{{ n.tap }}\" style=\"background:none;border:none;border-top:2px solid {{ n.bc }};color:{{ n.fg }};font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.16em;padding:14px 0 12px 0\">{{ n.lb }}<\u002Fbutton>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:420,&quot;height&quot;:900},&quot;reducedMotion&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Ajustes&quot;},&quot;chartDays&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:14,&quot;min&quot;:7,&quot;max&quot;:30,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Ajustes&quot;},&quot;showLockedAttacks&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Ajustes&quot;}}\">\nclass Component extends DCLogic {\n  KEY = 'sunder_v01';\n  ORDER = ['Negocio', 'Creación', 'Oficio', 'Cuerpo'];\n  TIERS = { 'Trivial': { xp: 10, dmg: 2 }, 'Menor': { xp: 25, dmg: 5 }, 'Estándar': { xp: 60, dmg: 12 }, 'Mayor': { xp: 150, dmg: 30 }, 'Épica': { xp: 400, dmg: 80 } };\n  MESES = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];\n  _fid = 0;\n  state = { data: this.load(), view: 'hoy', floats: [], hitSeq: 0, toast: null, summary: null, shatter: null, victoryO: null, exportOpen: false, exportText: '', copied: false, pmA: '', pmB: '', pmDrop: {}, nbOpen: false, nb: null, rematchDate: '' };\n\n  pad(n) { return (n < 10 ? '0' : '') + n; }\n  dk(dt) { return dt.getFullYear() + '-' + this.pad(dt.getMonth() + 1) + '-' + this.pad(dt.getDate()); }\n  today() { return this.dk(new Date()); }\n  nd(s) { const t = new Date(s + 'T12:00:00'); t.setDate(t.getDate() + 1); return this.dk(t); }\n  diff(a, b) { return Math.round((new Date(b + 'T12:00:00') - new Date(a + 'T12:00:00')) / 864e5); }\n  need(n) { return Math.round(100 * Math.pow(n, 1.5)); }\n  fmt(n) { return Math.round(n).toLocaleString('es-ES'); }\n  fdate(s) { const t = new Date(s + 'T12:00:00'); return t.getDate() + ' ' + this.MESES[t.getMonth()]; }\n  ftime(ts) { const t = new Date(ts); return t.getDate() + ' ' + this.MESES[t.getMonth()] + ' ' + this.pad(t.getHours()) + ':' + this.pad(t.getMinutes()); }\n  isSunday() { return new Date().getDay() === 0; }\n\n  seed() {\n    const t = this.today();\n    return {\n      v: 1, totalXp: 0, gold: 0, hp: 100, streak: 0, momentum: 1, lastDate: t, pausedUntil: 0, needPostmortem: false, postmortems: [], doneToday: {}, dayStats: {}, log: [], pendingCollects: [],\n      attrs: { 'Negocio': { level: 1, xp: 0 }, 'Creación': { level: 1, xp: 0 }, 'Oficio': { level: 1, xp: 0 }, 'Cuerpo': { level: 1, xp: 0 } },\n      dailies: [\n        { id: 'd1', name: 'Leer un libro 15 min', attr: 'Oficio', tier: 'Menor' },\n        { id: 'd2', name: 'Practicar piano 30 min', attr: 'Creación', tier: 'Menor' },\n        { id: 'd3', name: 'Escribir la reflexión del día', attr: 'Cuerpo', tier: 'Trivial' },\n        { id: 'd4', name: 'Duolingo 10 min', attr: 'Oficio', tier: 'Trivial' },\n        { id: 'd5', name: '30 min de trabajo enfocado', attrs: ['Negocio', 'Creación'], attr: 'Negocio', tier: 'Menor' },\n        { id: 'd6', name: 'Ir al gimnasio', attr: 'Cuerpo', tier: 'Menor', days: [2, 3, 5, 6] }\n      ],\n      boss: {\n        name: 'Primer vídeo con 1k de views', attr: 'Creación', createdAt: t, deadline: '2026-08-30', status: 'active', hpMax: 741, hp: 741, xpBase: 4630, collected: false, dmgByDay: {}, log: [],\n        attacks: [\n          { id: 'a1', name: 'Estudiar 3 vídeos que funcionan', tier: 'Menor', phase: 1, planned: 8, used: 0 },\n          { id: 'a2', name: 'Pensar/validar idea de vídeo', tier: 'Menor', phase: 1, planned: 10, used: 0 },\n          { id: 'a3', name: 'Grabar gameplay/vídeo', tier: 'Estándar', phase: 1, planned: 6, used: 0 },\n          { id: 'a4', name: 'Sesión de edición (1–2 h)', tier: 'Estándar', phase: 1, planned: 12, used: 0 },\n          { id: 'a5', name: 'Crear miniatura y título', tier: 'Mayor', phase: 2, planned: 4, used: 0 },\n          { id: 'a6', name: 'Publicar un short o clip', tier: 'Estándar', phase: 2, planned: 6, used: 0 },\n          { id: 'a7', name: 'Publicar el vídeo', tier: 'Épica', phase: 2, planned: 4, used: 0 },\n          { id: 'a8', name: 'Analizar CTR y retención', tier: 'Estándar', phase: 3, planned: 4, used: 0 },\n          { id: 'a9', name: 'Rehacer la miniatura de un vídeo ya publicado', tier: 'Mayor', phase: 3, planned: 2, used: 0 }\n        ]\n      },\n      rewards: [\n        { name: 'Una comida basura', price: 250 },\n        { name: 'Un capricho de menos de 10 €', price: 300 },\n        { name: 'Una tarde entera libre', price: 500 }\n      ]\n    };\n  }\n  DOW_ORDER = [1, 2, 3, 4, 5, 6, 0]; DOW_LB = ['L', 'M', 'X', 'J', 'V', 'S', 'D'];\n  load() {\n    try { const raw = localStorage.getItem(this.KEY); if (raw) { const d = JSON.parse(raw); if (d && d.attrs && d.dailies && d.boss) { this.migrate(d); return d; } } } catch (e) { }\n    return this.seed();\n  }\n  migrate(d) {\n    if (!d.dailies.some(dl => dl.id === 'd6')) d.dailies.push({ id: 'd6', name: 'Ir al gimnasio', attr: 'Cuerpo', tier: 'Menor', days: [2, 3, 5, 6] });\n  }\n  scheduledOn(dl, dow) { return !dl.days || dl.days.length === 0 || dl.days.includes(dow); }\n  toggleDayForDaily(dl, dow) {\n    const days = (dl.days && dl.days.length) ? dl.days.slice() : [0, 1, 2, 3, 4, 5, 6];\n    const i = days.indexOf(dow);\n    if (i >= 0) days.splice(i, 1); else days.push(dow);\n    dl.days = days.length === 7 ? null : days.sort((a, b) => a - b);\n    this.commit();\n  }\n  save() { try { localStorage.setItem(this.KEY, JSON.stringify(this.state.data)); } catch (e) { } }\n  commit() { this.save(); this.forceUpdate(); }\n  componentDidMount() { this.rollover(); }\n\n  phase(b) { const p = b.hp / b.hpMax * 100; return p > 66 ? 1 : p > 33 ? 2 : 3; }\n  bossTotal(b) { return Math.max(1, this.diff(b.createdAt, b.deadline)); }\n  furiaAt(b, dateKey) { return this.diff(dateKey, b.deadline) <= this.bossTotal(b) * 0.2; }\n\n  applyReward(attr, xp, gold, label, extra) {\n    const d = this.state.data; const a = d.attrs[attr];\n    if (a && xp > 0) {\n      a.xp += xp;\n      while (a.xp >= this.need(a.level)) { a.xp -= this.need(a.level); a.level++; d.log.unshift({ t: Date.now(), txt: attr.toUpperCase() + ' sube a NIVEL ' + a.level, xp: 0, gold: 0, lvl: true, attr }); }\n    }\n    d.totalXp += xp; d.gold += gold;\n    const e = { t: Date.now(), txt: label, xp, gold, dmg: (extra && extra.dmg) || 0, attr, note: '' };\n    d.log.unshift(e); if (d.log.length > 300) d.log.length = 300;\n    return e;\n  }\n  act(attr, tier, label, extra) {\n    const d = this.state.data;\n    const xp = Math.round(this.TIERS[tier].xp * d.momentum);\n    const gold = Math.round(xp / 4);\n    const e = this.applyReward(attr, xp, gold, label, extra);\n    return { xp, gold, e };\n  }\n  markDay(tier) {\n    const d = this.state.data; const k = this.today();\n    const s = d.dayStats[k] || (d.dayStats[k] = { actions: 0, minorPlus: false, bossAttacked: false });\n    s.actions++; if (tier !== 'Trivial') s.minorPlus = true;\n    return s;\n  }\n  showToast(r) {\n    clearTimeout(this._tt);\n    this.setState({ toast: { xp: r.xp, gold: r.gold, e: r.e } });\n    this._tt = setTimeout(() => this.setState({ toast: null }), 6000);\n  }\n\n  doDaily(dl, attrOverride) {\n    const d = this.state.data;\n    if (d.pausedUntil > Date.now() || d.doneToday[dl.id] || d.needPostmortem || !this.scheduledOn(dl, new Date().getDay())) return;\n    d.doneToday[dl.id] = true;\n    this.markDay(dl.tier);\n    const r = this.act(attrOverride || dl.attr, dl.tier, 'Daily: ' + dl.name);\n    this.showToast(r); this.commit();\n  }\n\n  doAttack(atk) {\n    const d = this.state.data, b = d.boss;\n    if (b.status !== 'active' || atk.phase > this.phase(b)) return;\n    const furia = this.furiaAt(b, this.today());\n    let mult = 1; if (this.phase(b) === 3) mult *= 1.25; if (furia) mult *= 1.5;\n    const dmg = Math.round(this.TIERS[atk.tier].dmg * mult);\n    b.hp = Math.max(0, +(b.hp - dmg).toFixed(1));\n    atk.used++;\n    const k = this.today(); b.dmgByDay[k] = (b.dmgByDay[k] || 0) + dmg;\n    const s = this.markDay(atk.tier); s.bossAttacked = true;\n    const r = this.act(b.attr, atk.tier, 'Ataque: ' + atk.name, { dmg });\n    b.log.unshift({ t: Date.now(), txt: atk.name, dmg, xp: r.xp }); if (b.log.length > 200) b.log.length = 200;\n    if (!(this.props.reducedMotion ?? false)) {\n      const id = ++this._fid;\n      const f = { id, txt: '−' + dmg, left: Math.round(12 + Math.random() * 62) };\n      this.setState({ floats: this.state.floats.concat([f]), hitSeq: this.state.hitSeq + 1 });\n      setTimeout(() => this.setState({ floats: this.state.floats.filter(x => x.id !== id) }), 980);\n    }\n    if (b.hp <= 0) { this.exhaust(); return; }\n    this.showToast(r); this.commit();\n  }\n  exhaust() {\n    const d = this.state.data, b = d.boss;\n    b.status = 'exhausted'; b.hp = 0;\n    const xp = Math.round(b.xpBase * 0.7); const gold = Math.round(b.xpBase / 4);\n    this.applyReward(b.attr, xp, gold, 'JEFE AGOTADO: ' + b.name + ' (70% XP, 100% oro)');\n    this.setState({ shatter: { xp, gold }, toast: null });\n    this.save();\n  }\n  doVictory() {\n    const d = this.state.data, b = d.boss;\n    if (b.status !== 'active') return;\n    b.status = 'victory'; b.collected = true;\n    const xp = b.xpBase, gold = Math.round(b.xpBase / 4);\n    this.applyReward(b.attr, xp, gold, 'VICTORIA REAL: ' + b.name);\n    this.setState({ victoryO: { xp, gold } });\n    this.save();\n  }\n  doCollect() {\n    const d = this.state.data, b = d.boss;\n    if (b.status !== 'exhausted' || b.collected) return;\n    b.collected = true;\n    const xp = Math.round(b.xpBase * 0.3);\n    this.applyReward(b.attr, xp, Math.round(xp / 4), 'COBRADO: ' + b.name + ' (el resultado llegó)');\n    this.setState({ victoryO: { xp, gold: Math.round(xp / 4) } });\n    this.save();\n  }\n  timeoutBoss() {\n    const d = this.state.data, b = d.boss;\n    const frac = Math.max(0, Math.min(1, 1 - b.hp / b.hpMax));\n    const xp = Math.round(b.xpBase * frac);\n    b.status = 'timeout';\n    this.applyReward(b.attr, xp, Math.round(xp / 4), 'TIEMPO AGOTADO: ' + b.name + ' (' + Math.round(frac * 100) + '% del daño hecho)');\n    d.hp = Math.max(0, d.hp - 25);\n    return xp;\n  }\n  doRematch() {\n    const d = this.state.data, b = d.boss;\n    const nd = this.state.rematchDate;\n    if (b.status !== 'timeout' || !nd || nd <= this.today()) return;\n    b.createdAt = this.today(); b.deadline = nd; b.status = 'active';\n    d.log.unshift({ t: Date.now(), txt: 'REVANCHA contra ' + b.name + ' — nueva fecha: ' + this.fdate(nd), xp: 0, gold: 0 });\n    this.setState({ rematchDate: '' }); this.commit();\n  }\n  collapse() {\n    const d = this
